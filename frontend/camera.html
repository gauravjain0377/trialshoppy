<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Live Try-On — MirrorAI</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #000;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: 'Outfit', 'Segoe UI', sans-serif;
      color: #fff;
      touch-action: manipulation;
    }

    /* ── Camera / Canvas Layers ── */
    #video {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      z-index: 1;
      transform: scaleX(-1); /* mirror / selfie mode */
    }

    /* Main garment overlay canvas (no CSS mirror — we flip x in code) */
    #overlay-canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 2;
      pointer-events: none;
    }

    /* ── Back Button ── */
    #back-btn {
      position: fixed;
      top: 20px; left: 20px;
      z-index: 100;
      width: 44px; height: 44px;
      background: rgba(0,0,0,0.55);
      border: 1.5px solid rgba(255,255,255,0.25);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(12px);
      transition: background 0.2s;
      text-decoration: none;
    }
    #back-btn:hover { background: rgba(0,0,0,0.8); }
    #back-btn svg { width: 20px; height: 20px; }

    /* ── Mode Label ── */
    #mode-label {
      position: fixed;
      top: 22px;
      left: 50%; transform: translateX(-50%);
      z-index: 100;
      background: rgba(0,0,0,0.5);
      border: 1px solid rgba(168,85,247,0.4);
      border-radius: 999px;
      padding: 6px 18px;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      backdrop-filter: blur(12px);
      color: #d8b4fe;
      white-space: nowrap;
    }

    /* ── Tracking Status Dot ── */
    #track-status {
      position: fixed;
      top: 22px; right: 20px;
      z-index: 100;
      width: 10px; height: 10px;
      border-radius: 50%;
      background: #6b7280;
      box-shadow: 0 0 8px rgba(107,114,128,0.5);
      transition: background 0.3s, box-shadow 0.3s;
    }
    #track-status.tracking {
      background: #22c55e;
      box-shadow: 0 0 10px rgba(34,197,94,0.7);
    }
    #track-status.lost {
      background: #f59e0b;
      box-shadow: 0 0 10px rgba(245,158,11,0.6);
    }

    /* ── Selected Product Badge ── */
    #selected-label {
      position: fixed;
      top: 68px;
      left: 50%; transform: translateX(-50%);
      z-index: 100;
      background: rgba(168,85,247,0.25);
      border: 1px solid rgba(168,85,247,0.5);
      border-radius: 999px;
      padding: 5px 16px;
      font-size: 0.78rem;
      font-weight: 600;
      backdrop-filter: blur(8px);
      display: none;
      white-space: nowrap;
    }

    /* ── Guidance hint ── */
    #hint-bar {
      position: fixed;
      bottom: 215px;
      left: 50%; transform: translateX(-50%);
      z-index: 25;
      background: rgba(0,0,0,0.5);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 999px;
      padding: 6px 18px;
      font-size: 0.72rem;
      font-weight: 500;
      color: rgba(255,255,255,0.7);
      backdrop-filter: blur(10px);
      white-space: nowrap;
      transition: opacity 0.5s;
    }

    /* ── Bottom Gradient Overlay ── */
    #bottom-overlay {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: 240px;
      background: linear-gradient(to top, rgba(0,0,0,0.92) 0%, rgba(10,5,25,0.72) 55%, transparent 100%);
      z-index: 10;
      pointer-events: none;
    }

    /* ── Product Strip ── */
    #product-strip-wrap {
      position: fixed;
      bottom: 110px; left: 0; right: 0;
      z-index: 20;
      padding: 12px 0;
    }

    #product-strip {
      display: flex;
      flex-direction: row;
      gap: 14px;
      padding: 4px 24px;
      overflow-x: auto;
      overflow-y: hidden;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      justify-content: flex-start;
    }
    #product-strip::-webkit-scrollbar { display: none; }

    .prod-circle {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      flex-shrink: 0;
      transition: transform 0.15s;
    }
    .prod-circle:active { transform: scale(0.88); }

    .prod-circle-img {
      width: 72px; height: 72px;
      border-radius: 50%;
      background: rgba(255,255,255,0.10);
      border: 2.5px solid rgba(255,255,255,0.18);
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
      transition: border-color 0.2s, box-shadow 0.2s, transform 0.2s;
      backdrop-filter: blur(8px);
    }
    .prod-circle-img img {
      width: 58px; height: 58px;
      object-fit: contain;
      border-radius: 50%;
    }
    .prod-circle-img .prod-emoji {
      font-size: 28px;
      line-height: 1;
    }

    .prod-circle.selected .prod-circle-img {
      border-color: #fbbf24;
      box-shadow: 0 0 0 3px rgba(251,191,36,0.45), 0 0 22px rgba(251,191,36,0.4);
      transform: scale(1.08);
    }
    .prod-circle.none-item .prod-circle-img {
      background: rgba(255,255,255,0.06);
    }
    .prod-circle.none-item.selected .prod-circle-img {
      border-color: rgba(255,255,255,0.5);
      box-shadow: 0 0 0 3px rgba(255,255,255,0.2);
    }

    .prod-circle-name {
      font-size: 0.62rem;
      font-weight: 600;
      text-align: center;
      max-width: 76px;
      line-height: 1.2;
      color: rgba(255,255,255,0.80);
      text-shadow: 0 1px 5px rgba(0,0,0,0.9);
    }

    /* ── Capture Button ── */
    #capture-btn {
      position: fixed;
      bottom: 28px;
      left: 50%; transform: translateX(-50%);
      z-index: 30;
      width: 72px; height: 72px;
      border-radius: 50%;
      background: #fff;
      border: 5px solid rgba(255,255,255,0.35);
      cursor: pointer;
      box-shadow: 0 0 0 3px rgba(255,255,255,0.2), 0 4px 22px rgba(0,0,0,0.55);
      transition: transform 0.1s, box-shadow 0.1s;
    }
    #capture-btn:active {
      transform: translateX(-50%) scale(0.88);
      box-shadow: 0 0 0 6px rgba(255,255,255,0.28);
    }
    #capture-btn::after {
      content: '';
      position: absolute;
      inset: 6px;
      background: #fff;
      border-radius: 50%;
      border: 2px solid rgba(0,0,0,0.07);
    }

    /* ── Flash ── */
    #flash {
      position: fixed;
      inset: 0;
      background: #fff;
      opacity: 0;
      z-index: 200;
      pointer-events: none;
      transition: opacity 0.07s ease;
    }
    #flash.active { opacity: 0.9; }

    /* ── Error Screen ── */
    #error-screen {
      position: fixed;
      inset: 0;
      background: #0a0515;
      z-index: 500;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      text-align: center;
      padding: 40px;
    }
    #error-screen.show { display: flex; }
    #error-screen h2 { font-size: 1.4rem; color: #f0e0ff; }
    #error-screen p { color: rgba(255,255,255,0.6); font-size: 0.9rem; max-width: 320px; line-height: 1.6; }
    .err-icon { font-size: 56px; }
    .err-back-btn {
      margin-top: 8px;
      padding: 12px 28px;
      background: linear-gradient(135deg,#a855f7,#6366f1);
      border: none; border-radius: 999px;
      color: #fff; font-size: 0.95rem; font-weight: 700;
      cursor: pointer;
    }

    /* ── Loading Screen ── */
    #loading-screen {
      position: fixed;
      inset: 0;
      background: #0a0515;
      z-index: 400;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }
    #loading-screen h3 { color: #d8b4fe; font-size: 1.1rem; }
    #loading-screen p  { color: rgba(255,255,255,0.5); font-size: 0.82rem; }
    .spin {
      width: 44px; height: 44px;
      border: 3px solid rgba(168,85,247,0.2);
      border-top-color: #a855f7;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Body outline guide (shown when no product selected) ── */
    #body-guide {
      position: fixed;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      display: none;
    }

    /* ── Snap info overlay ── */
    #snap-overlay {
      position: fixed;
      inset: 0;
      z-index: 180;
      pointer-events: none;
    }
    #snap-label {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0);
      background: rgba(168,85,247,0.85);
      border-radius: 16px;
      padding: 12px 28px;
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      backdrop-filter: blur(12px);
      transition: transform 0.25s cubic-bezier(0.34,1.56,0.64,1), opacity 0.3s;
      opacity: 0;
      white-space: nowrap;
    }
    #snap-label.show {
      transform: translate(-50%, -50%) scale(1);
      opacity: 1;
    }
  </style>
</head>
<body>

<div id="flash"></div>

<!-- Loading screen -->
<div id="loading-screen">
  <div class="spin"></div>
  <h3>Starting AR Try-On...</h3>
  <p>Allow camera access when prompted</p>
</div>

<!-- Error screen -->
<div id="error-screen">
  <div class="err-icon">📷</div>
  <h2>Camera Not Available</h2>
  <p id="error-msg">Camera access was denied or is not supported. Please allow camera access and reload.</p>
  <button class="err-back-btn" onclick="window.location.href='tryon.html'">← Back to Photo Try-On</button>
</div>

<!-- Live camera feed -->
<video id="video" autoplay playsinline muted></video>

<!-- Garment overlay canvas -->
<canvas id="overlay-canvas"></canvas>

<!-- Snap overlay for product label flash -->
<div id="snap-overlay">
  <div id="snap-label"></div>
</div>

<!-- Back button -->
<a id="back-btn" href="tryon.html" title="Back">
  <svg viewBox="0 0 20 20" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 16L6 10l6-6"/>
  </svg>
</a>

<!-- Tracking dot -->
<div id="track-status"></div>

<!-- Mode label -->
<div id="mode-label">✨ Live AR Try-On</div>

<!-- Selected product label -->
<div id="selected-label"></div>

<!-- Hint bar -->
<div id="hint-bar">👆 Tap an outfit below to try it on</div>

<!-- Bottom gradient -->
<div id="bottom-overlay"></div>

<!-- Product strip -->
<div id="product-strip-wrap">
  <div id="product-strip"></div>
</div>

<!-- Capture button -->
<button id="capture-btn" title="Take photo"></button>

<!-- MediaPipe -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
<script>
// ══════════════════════════════════════════════════════════════════════
//  PRODUCTS CATALOGUE
// ══════════════════════════════════════════════════════════════════════
const PRODUCTS = [
  { id: 'none',  name: 'None',               category: 'none',        emoji: '🚫' },
  { id: 'c4',    name: 'Hoodie',             category: 'clothing',    emoji: '🫶', aspectRatio: 1.02 },
  { id: 'c1',    name: 'Classic White Tee',  category: 'clothing',    emoji: '👕', aspectRatio: 1.12 },
  { id: 'c2',    name: 'Denim Jacket',       category: 'clothing',    emoji: '🧥', aspectRatio: 1.15 },
  { id: 'c3',    name: 'Formal Blazer',      category: 'clothing',    emoji: '🥋', aspectRatio: 1.12 },
  { id: 'c5',    name: 'Floral Shirt',       category: 'clothing',    emoji: '🌺', aspectRatio: 1.10 },
  { id: 'e1',    name: 'Aviator Shades',     category: 'eyewear',     emoji: '🕶️' },
  { id: 'e2',    name: 'Round Frames',       category: 'eyewear',     emoji: '👓' },
  { id: 'e3',    name: 'Wayfarers',          category: 'eyewear',     emoji: '😎' },
  { id: 'a1',    name: 'Baseball Cap',       category: 'accessories', emoji: '🧢' },
  { id: 'a2',    name: 'Chain Necklace',     category: 'accessories', emoji: '📿' },
  { id: 'a3',    name: 'Minimal Watch',      category: 'accessories', emoji: '⌚' },
];

// ══════════════════════════════════════════════════════════════════════
//  STATE
// ══════════════════════════════════════════════════════════════════════
let selectedProduct  = null;
let latestLandmarks  = null;
let videoStream      = null;
let poseInstance     = null;
let cameraUtil       = null;
let frameCount       = 0;
let trackingActive   = false;

// Smoothed landmark buffer (EMA for jitter reduction)
const SMOOTH_ALPHA    = 0.40;   // 0=full smooth, 1=raw. 0.40 = nice balance
let smoothedLandmarks = null;

const video   = document.getElementById('video');
const canvas  = document.getElementById('overlay-canvas');
const ctx     = canvas.getContext('2d', { alpha: true, willReadFrequently: false });

// ══════════════════════════════════════════════════════════════════════
//  PRE-LOAD PRODUCT IMAGES
// ══════════════════════════════════════════════════════════════════════
const productImages = {};
PRODUCTS.forEach(p => {
  if (p.id === 'none') return;
  const img = new Image();
  img.crossOrigin = 'anonymous';
  img.src = `assets/products/${p.id}.png`;
  img.onerror = () => { img._failed = true; };
  productImages[p.id] = img;
});

// ══════════════════════════════════════════════════════════════════════
//  CANVAS RESIZE
// ══════════════════════════════════════════════════════════════════════
function resizeCanvas() {
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

// ══════════════════════════════════════════════════════════════════════
//  LANDMARK COORDINATE HELPER
//  We CSS-mirror the <video> but NOT the canvas.
//  So we flip x: screenX = W - normalizedX * W
// ══════════════════════════════════════════════════════════════════════
function lm(landmarks, idx, W, H, minVis = 0.25) {
  const p = landmarks[idx];
  if (!p || p.visibility < minVis) return null;
  return { x: W - p.x * W, y: p.y * H, v: p.visibility };
}

// ══════════════════════════════════════════════════════════════════════
//  EXPONENTIAL MOVING AVERAGE SMOOTHER
//  Reduces jitter while keeping responsiveness
// ══════════════════════════════════════════════════════════════════════
function smoothLandmarks(raw) {
  if (!raw) return null;
  if (!smoothedLandmarks) {
    smoothedLandmarks = raw.map(p => ({ ...p }));
    return smoothedLandmarks;
  }
  for (let i = 0; i < raw.length; i++) {
    const r = raw[i];
    const s = smoothedLandmarks[i];
    if (!r || !s) { smoothedLandmarks[i] = r; continue; }
    s.x = s.x + SMOOTH_ALPHA * (r.x - s.x);
    s.y = s.y + SMOOTH_ALPHA * (r.y - s.y);
    s.z = (s.z || 0) + SMOOTH_ALPHA * ((r.z || 0) - (s.z || 0));
    s.visibility = s.visibility + 0.25 * (r.visibility - s.visibility);
  }
  return smoothedLandmarks;
}

// ══════════════════════════════════════════════════════════════════════
//  MAIN GARMENT DRAWING — CLOTHING (shirts, hoodies, jackets)
//
//  How the reference app works (and how we do it now):
//    1. Detect shoulders → get width, midpoint, tilt angle
//    2. Scale garment PNG to match body width
//    3. Position collar at neck/shoulder junction
//    4. Rotate to match shoulder tilt
//    5. Simple drawImage — the PNG transparency does the rest
//
//  That's it. Clean, fast, looks perfect. No strip warping needed.
// ══════════════════════════════════════════════════════════════════════
function drawClothing(lms, W, H, product) {
  const ls   = lm(lms, 11, W, H, 0.12); // left shoulder
  const rs   = lm(lms, 12, W, H, 0.12); // right shoulder
  const nose = lm(lms, 0,  W, H, 0.08); // nose (for collar Y)

  if (!ls || !rs) return;

  const pImg = productImages[product.id];
  if (!pImg || !pImg.complete || pImg.naturalWidth === 0 || pImg._failed) return;

  // ── Shoulder measurement
  const sw = Math.hypot(rs.x - ls.x, rs.y - ls.y);
  if (sw < 20 || sw > W * 0.98) return;

  // ── Garment size
  //    The PNG is a flatlay; we scale it so its width covers
  //    the person's full upper body (shoulders + sleeves).
  //    ~2.4× skeleton shoulder distance = realistic coverage.
  const garmentW = sw * 2.40;
  const garmentH = garmentW * (pImg.naturalHeight / pImg.naturalWidth);

  // ── Anchor point: collar center
  //    The collar opening in a typical flatlay PNG sits at roughly
  //    8-12% down from the top edge. We position the garment so
  //    that point lands right at the base of the person's neck.
  const shoulderMidX = (ls.x + rs.x) / 2;
  const shoulderMidY = (ls.y + rs.y) / 2;

  // Collar Y = slightly above shoulders, but below nose
  const collarY = nose
    ? Math.min(shoulderMidY - sw * 0.04, nose.y + sw * 0.50)
    : shoulderMidY - sw * 0.04;

  // How far down the PNG is the collar? ~10% from top
  const collarFrac = 0.10;
  const garmentTopY = collarY - garmentH * collarFrac;
  const garmentCenterX = shoulderMidX;
  const garmentCenterY = garmentTopY + garmentH / 2;

  // ── Shoulder tilt (person leaning)
  const tiltAngle = Math.atan2(rs.y - ls.y, rs.x - ls.x);

  // ── Draw
  ctx.save();
  ctx.translate(garmentCenterX, garmentCenterY);
  ctx.rotate(tiltAngle);
  ctx.globalAlpha = 1.0;
  ctx.drawImage(pImg, -garmentW / 2, -garmentH / 2, garmentW, garmentH);
  ctx.restore();
}

// ══════════════════════════════════════════════════════════════════════
//  EYEWEAR DRAWING
// ══════════════════════════════════════════════════════════════════════
function drawEyewear(lms, W, H, product) {
  // MediaPipe Pose gives eye landmarks 2 (l inner), 5 (r inner)
  // Use left_eye=2, right_eye=5 for center of each eye
  const raw = (idx) => {
    const p = lms[idx];
    if (!p || p.visibility < 0.10) return null;
    return { x: W - p.x * W, y: p.y * H, v: p.visibility };
  };

  let leye = raw(2);
  let reye = raw(5);
  const nose = raw(0);
  const ls   = lm(lms, 11, W, H, 0.15);
  const rs   = lm(lms, 12, W, H, 0.15);

  // Fallback if eye landmarks not reliable
  if (!leye || !reye) {
    if (nose && ls && rs) {
      const faceW = Math.abs(rs.x - ls.x) * 0.38;
      leye = { x: nose.x - faceW * 0.48, y: nose.y - faceW * 0.32, v: 0.5 };
      reye = { x: nose.x + faceW * 0.48, y: nose.y - faceW * 0.32, v: 0.5 };
    } else return;
  }

  // Ensure left is actually on left side of screen
  if (leye.x > reye.x) { const tmp = leye; leye = reye; reye = tmp; }

  const eyeSpan = Math.hypot(reye.x - leye.x, reye.y - leye.y);
  const midX    = (leye.x + reye.x) / 2;
  const midY    = (leye.y + reye.y) / 2;
  const angle   = Math.atan2(reye.y - leye.y, reye.x - leye.x);

  // Glasses width = ~2x the eye span (covers temples)
  const gW = eyeSpan * 2.10;
  const gH = gW * 0.46;

  const pImg = productImages[product.id];
  if (!pImg || !pImg.complete || pImg.naturalWidth === 0 || pImg._failed) return;

  ctx.save();
  ctx.translate(midX, midY + gH * 0.04);
  ctx.rotate(angle);
  ctx.globalAlpha = 0.98;
  ctx.drawImage(pImg, -gW / 2, -gH / 2, gW, gH);
  ctx.restore();
}

// ══════════════════════════════════════════════════════════════════════
//  ACCESSORIES DRAWING
// ══════════════════════════════════════════════════════════════════════
function drawAccessory(lms, W, H, product) {
  const pImg = productImages[product.id];
  if (!pImg || !pImg.complete || pImg.naturalWidth === 0 || pImg._failed) return;

  const nose = lm(lms, 0,  W, H, 0.10);
  const ls   = lm(lms, 11, W, H, 0.20);
  const rs   = lm(lms, 12, W, H, 0.20);
  const lear = lm(lms, 7,  W, H, 0.10);
  const rear = lm(lms, 8,  W, H, 0.10);
  const lwrist = lm(lms, 15, W, H, 0.12);
  const rwrist = lm(lms, 16, W, H, 0.12);

  if (product.id === 'a1') { // Cap
    let headCX, headW, headTopY;
    if (lear && rear) {
      headCX   = (lear.x + rear.x) / 2;
      headW    = Math.abs(rear.x - lear.x) * 1.48;
      headTopY = Math.min(lear.y, rear.y);
    } else if (nose && ls && rs) {
      const sw = Math.abs(rs.x - ls.x);
      headCX   = nose.x;
      headW    = sw * 0.52;
      headTopY = nose.y - headW * 0.55;
    } else if (nose) {
      headCX   = nose.x;
      headW    = W * 0.22;
      headTopY = nose.y - headW * 0.55;
    } else return;

    const capW = headW * 1.45;
    const capH = capW * 0.65;

    const angle = (lear && rear) ? Math.atan2(rear.y - lear.y, rear.x - lear.x) : 0;

    ctx.save();
    ctx.translate(headCX, headTopY - capH * 0.22);
    ctx.rotate(angle);
    ctx.globalAlpha = 0.97;
    ctx.drawImage(pImg, -capW / 2, -capH / 2, capW, capH);
    ctx.restore();

  } else if (product.id === 'a2') { // Necklace
    if (!ls || !rs) return;
    const sw   = Math.hypot(rs.x - ls.x, rs.y - ls.y);
    const midX = (ls.x + rs.x) / 2;
    const midY = (ls.y + rs.y) / 2;
    const angle = Math.atan2(rs.y - ls.y, rs.x - ls.x);
    const nW = sw * 0.88;
    const nH = nW * 0.65;

    ctx.save();
    ctx.translate(midX, midY + nH * 0.12);
    ctx.rotate(angle);
    ctx.globalAlpha = 0.95;
    ctx.drawImage(pImg, -nW / 2, -nH / 2, nW, nH);
    ctx.restore();

  } else if (product.id === 'a3') { // Watch
    const wrist = lwrist || rwrist;
    if (!wrist) return;
    const sw = (ls && rs) ? Math.hypot(rs.x - ls.x, rs.y - ls.y) : W * 0.25;
    const watchSize = sw * 0.28;

    ctx.save();
    ctx.translate(wrist.x, wrist.y);
    ctx.globalAlpha = 0.97;
    ctx.drawImage(pImg, -watchSize / 2, -watchSize / 2, watchSize, watchSize);
    ctx.restore();
  }
}

// ══════════════════════════════════════════════════════════════════════
//  GARMENT DISPATCH
// ══════════════════════════════════════════════════════════════════════
function drawGarment(lms, W, H, product) {
  if (!product || product.id === 'none' || !lms) return;
  const cat = product.category;
  if      (cat === 'clothing')    drawClothing(lms, W, H, product);
  else if (cat === 'eyewear')     drawEyewear(lms, W, H, product);
  else if (cat === 'accessories') drawAccessory(lms, W, H, product);
}

// ══════════════════════════════════════════════════════════════════════
//  RENDER LOOP — called every frame by MediaPipe
// ══════════════════════════════════════════════════════════════════════
function renderFrame(rawLandmarks) {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  if (!rawLandmarks) {
    setTrackStatus(false);
    return;
  }

  // Smooth landmarks
  const lms = smoothLandmarks(rawLandmarks);
  setTrackStatus(true);

  if (selectedProduct && selectedProduct.id !== 'none') {
    drawGarment(lms, canvas.width, canvas.height, selectedProduct);
  }
  frameCount++;
}

// ══════════════════════════════════════════════════════════════════════
//  TRACKING STATUS INDICATOR
// ══════════════════════════════════════════════════════════════════════
let _lastTrackChange = 0;
function setTrackStatus(active) {
  const dot = document.getElementById('track-status');
  if (!dot) return;
  if (active === trackingActive) return;
  trackingActive = active;
  dot.className = active ? 'tracking' : 'lost';
}

// ══════════════════════════════════════════════════════════════════════
//  PRODUCT STRIP UI
// ══════════════════════════════════════════════════════════════════════
function buildProductStrip() {
  const strip = document.getElementById('product-strip');
  strip.innerHTML = '';

  PRODUCTS.forEach(p => {
    const div = document.createElement('div');
    div.className = 'prod-circle' + (p.id === 'none' ? ' none-item' : '');
    div.dataset.id = p.id;

    const pImg = productImages[p.id];
    const imgHTML = (p.id !== 'none' && pImg)
      ? `<img src="assets/products/${p.id}.png" alt="${p.name}" onerror="this.style.display='none';this.nextElementSibling.style.display='block'"><span class="prod-emoji" style="display:none">${p.emoji}</span>`
      : `<span class="prod-emoji">${p.emoji}</span>`;

    div.innerHTML = `
      <div class="prod-circle-img">${imgHTML}</div>
      <div class="prod-circle-name">${p.name}</div>
    `;
    div.addEventListener('click', () => selectProduct(p.id));
    strip.appendChild(div);
  });

  // Auto-select hoodie (c4) on load
  selectProduct('c4');
}

function selectProduct(id) {
  const prev = selectedProduct;
  if (prev?.id === id) return; // Already selected — no toggle for camera view

  selectedProduct = PRODUCTS.find(p => p.id === id) || null;

  // Update UI circles
  document.querySelectorAll('.prod-circle').forEach(el =>
    el.classList.toggle('selected', el.dataset.id === id));

  // Selected label
  const label = document.getElementById('selected-label');
  if (selectedProduct && selectedProduct.id !== 'none') {
    label.textContent = `${selectedProduct.emoji}  ${selectedProduct.name}`;
    label.style.display = 'block';
  } else {
    label.style.display = 'none';
  }

  // Hint update
  const hint = document.getElementById('hint-bar');
  if (selectedProduct && selectedProduct.id !== 'none') {
    hint.textContent = '✅ Stand back so your full torso is visible';
  } else {
    hint.textContent = '👆 Tap an outfit below to try it on';
  }

  // Flash product name
  if (selectedProduct && selectedProduct.id !== 'none') {
    const snapLabel = document.getElementById('snap-label');
    snapLabel.textContent = `${selectedProduct.emoji} ${selectedProduct.name}`;
    snapLabel.classList.add('show');
    setTimeout(() => snapLabel.classList.remove('show'), 1400);
  }

  // Reset smoother to avoid ghost positions
  smoothedLandmarks = null;
}

// ══════════════════════════════════════════════════════════════════════
//  CAPTURE — composite video + garment
// ══════════════════════════════════════════════════════════════════════
function capturePhoto() {
  const flash = document.getElementById('flash');
  flash.classList.add('active');
  setTimeout(() => flash.classList.remove('active'), 180);

  const vW = video.videoWidth  || canvas.width;
  const vH = video.videoHeight || canvas.height;

  const cap = document.createElement('canvas');
  cap.width = vW; cap.height = vH;
  const cCtx = cap.getContext('2d');

  // Mirror the video
  cCtx.save();
  cCtx.translate(vW, 0);
  cCtx.scale(-1, 1);
  cCtx.drawImage(video, 0, 0, vW, vH);
  cCtx.restore();

  // Scale the overlay canvas onto capture canvas
  cCtx.drawImage(canvas, 0, 0, vW, vH);

  // Watermark
  const wSz = Math.max(13, vW * 0.018);
  cCtx.font = `bold ${wSz}px Outfit, sans-serif`;
  cCtx.textAlign = 'right';
  cCtx.fillStyle = 'rgba(168,85,247,0.82)';
  cCtx.globalAlpha = 0.78;
  cCtx.fillText('MirrorAI — Live Try-On', vW - 16, vH - 16);

  const link = document.createElement('a');
  link.download = `mirrorai_live_${Date.now()}.jpg`;
  link.href = cap.toDataURL('image/jpeg', 0.93);
  link.click();
}

// ══════════════════════════════════════════════════════════════════════
//  MEDIAPIPE POSE SETUP
// ══════════════════════════════════════════════════════════════════════
function setupMediaPipe() {
  if (typeof Pose === 'undefined') {
    console.warn('MediaPipe Pose not available — using fallback');
    runFallback();
    return;
  }

  poseInstance = new Pose({
    locateFile: file => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
  });

  poseInstance.setOptions({
    modelComplexity:         1,      // 0=lite, 1=full, 2=heavy
    smoothLandmarks:         true,
    enableSegmentation:      false,
    smoothSegmentation:      false,
    minDetectionConfidence:  0.50,
    minTrackingConfidence:   0.50,
  });

  poseInstance.onResults(results => {
    latestLandmarks = results.poseLandmarks || null;
    renderFrame(latestLandmarks);
  });

  // Use MediaPipe Camera utility if available for best performance
  if (typeof Camera !== 'undefined') {
    cameraUtil = new Camera(video, {
      onFrame: async () => {
        try { await poseInstance.send({ image: video }); } catch(e) {}
      },
      width: 1280, height: 720,
    });
    cameraUtil.start()
      .then(hideLoading)
      .catch(err => {
        console.warn('Camera util failed:', err);
        hideLoading();
        fallbackRenderLoop();
      });
  } else {
    hideLoading();
    fallbackRenderLoop();
  }
}

function fallbackRenderLoop() {
  const loop = async () => {
    if (video.readyState >= 2 && poseInstance) {
      try { await poseInstance.send({ image: video }); } catch(e) {}
    }
    requestAnimationFrame(loop);
  };
  loop();
}

function runFallback() {
  hideLoading();
  const loop = () => {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    // No landmarks — just clear canvas
    requestAnimationFrame(loop);
  };
  loop();
}

// ══════════════════════════════════════════════════════════════════════
//  CAMERA INIT
// ══════════════════════════════════════════════════════════════════════
async function initCamera() {
  try {
    // Try rear camera first on desktop, front on mobile
    const constraints = {
      video: {
        facingMode: 'user',
        width:  { ideal: 1280, min: 640 },
        height: { ideal: 720,  min: 360 },
      },
      audio: false,
    };

    videoStream = await navigator.mediaDevices.getUserMedia(constraints);
    video.srcObject = videoStream;

    await new Promise((res, rej) => {
      video.onloadedmetadata = res;
      video.onerror = rej;
      setTimeout(rej, 8000); // timeout safety
    });

    await video.play();
    setupMediaPipe();

  } catch (err) {
    const msg = err.name === 'NotAllowedError'
      ? 'Camera access was denied. Allow camera access in your browser settings and reload.'
      : err.name === 'NotFoundError'
        ? 'No camera found. Connect a camera and reload.'
        : 'Cannot access camera. Make sure no other app is using it, then reload.';
    showError(msg);
  }
}

// ══════════════════════════════════════════════════════════════════════
//  UI HELPERS
// ══════════════════════════════════════════════════════════════════════
function hideLoading() {
  const ls = document.getElementById('loading-screen');
  if (ls) ls.style.display = 'none';
}
function showError(msg) {
  hideLoading();
  document.getElementById('error-msg').textContent = msg;
  document.getElementById('error-screen').classList.add('show');
}

// ══════════════════════════════════════════════════════════════════════
//  INIT
// ══════════════════════════════════════════════════════════════════════
document.addEventListener('DOMContentLoaded', () => {
  buildProductStrip();

  document.getElementById('capture-btn').addEventListener('click', capturePhoto);

  if (!navigator.mediaDevices?.getUserMedia) {
    showError('Your browser does not support camera access. Use Chrome or Safari on a recent version.');
    return;
  }

  initCamera();
});

// Cleanup on page unload
window.addEventListener('pagehide', () => {
  if (cameraUtil)   try { cameraUtil.stop();  } catch(e) {}
  if (videoStream)  videoStream.getTracks().forEach(t => t.stop());
  if (poseInstance) try { poseInstance.close(); } catch(e) {}
});
</script>
